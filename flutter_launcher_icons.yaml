# dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/logo.png"

  android: "launcher_icon"
  image_path_android: "assets/icon/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#085041"
  adaptive_icon_foreground: "assets/icon/logo.png"

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icon/logo.png"
    background_color: "#085041"
    theme_color: "#085041"

  windows:
    generate: true
    image_path: "assets/icon/logo.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/icon/logo.png"
